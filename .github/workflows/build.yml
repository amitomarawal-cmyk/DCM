name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip the project (no manual extract needed)
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip file found in the repo root!"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p _proj
          unzip -q -o "$ZIP" -d _proj
          SETTINGS=$(find _proj -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle not found inside the zip!"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk out/ProCam-Studio.apk
          ls -lh out

      - name: Upload APK (Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ProCam-Studio-APK
          path: out/ProCam-Studio.apk

      - name: Publish APK to Releases (direct download link)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ProCam Studio build ${{ github.run_number }}
          files: out/ProCam-Studio.apk
