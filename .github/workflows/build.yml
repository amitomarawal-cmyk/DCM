name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip source (only if you uploaded the zip file)
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -q -o "$z" -d _src; done

      - name: Find project folder
        id: p
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          echo "Found: $S"
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SohojKeyboard-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
